[env]
DATABASE_URL="postgresql://datapi:datapi@postgres:5432/datapi"
AUTH_TOKEN="test-token"
FRANCECONNECT_CLIENT_ID=""
FRANCECONNECT_CLIENT_SECRET=""
FC_AUTHORIZATION_URL="https://fcp-low.sbx.dev-franceconnect.fr/api/v2/authorize"
FC_TOKEN_URL="https://fcp-low.sbx.dev-franceconnect.fr/api/v2/token"
FC_USERINFO_URL="https://fcp-low.sbx.dev-franceconnect.fr/api/v2/userinfo"  
FC_REDIRECT_URI="http://localhost:8000/user/auth/fc/callback"
SESSION_COOKIE_SECURE="false"

[tools]
python = "3.13"

[tasks.install]
description = "Installe l'environnement Python et les dépendances du projet"
run = "uv sync"

[tasks.start]
description = "Démarre l'API en local avec rechargement automatique (http://127.0.0.1:8000)"
run = "uv run --no-sync uvicorn api.server:app --reload --host 127.0.0.1 --port 8000"

[tasks.start-docker]
description = "Démarre la stack complète via Docker Compose (API + auth)"
run = "docker compose up --build"
