<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Datapi - Exécuter un algorithme</title>
<style>
  :root {
    color-scheme: light;
    --bg: #f5f6f8;
    --panel: #ffffff;
    --border: #dde1e6;
    --text: #1b1f24;
    --muted: #6b7280;
    --accent: #000091;
    --accent-hover: #1a1a6e;
    --ok: #15803d;
    --err: #b91c1c;
    --warning: #ffc107;
    --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    font-size: 14px;
  }
  
  header {
    padding: 20px 28px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 12px;
    background: var(--panel);
  }
  
  header h1 {
    font-size: 18px;
    margin: 0;
    font-weight: 600;
  }
  
  header .subtitle {
    color: var(--muted);
    font-size: 12.5px;
    margin-top: 2px;
  }
  
  .back-link {
    display: flex;
    align-items: center;
    gap: 6px;
    color: var(--accent);
    text-decoration: none;
    font-size: 13px;
    padding: 8px 14px;
    border-radius: 6px;
  }
  
  .back-link:hover {
    background: var(--bg);
  }
  
  .back-link svg {
    width: 14px;
    height: 14px;
  }
  
  main {
    padding: 24px 28px;
    max-width: 1200px;
    margin: 0 auto;
    display: grid;
    grid-template-columns: 1fr;
    gap: 20px;
  }
  
  @media (min-width: 900px) {
    main {
      grid-template-columns: 350px 1fr;
      gap: 24px;
    }
  }
  
  .panel {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 20px;
  }
  
  .panel h2 {
    font-size: 14px;
    text-transform: uppercase;
    letter-spacing: .04em;
    color: var(--muted);
    margin: 0 0 16px;
    padding-bottom: 8px;
    border-bottom: 1px solid var(--border);
  }
  
  .algo-info {
    display: flex;
    flex-direction: column;
    gap: 16px;
  }
  
  .algo-title {
    font-size: 18px;
    font-weight: 600;
    margin: 0;
  }
  
  .algo-id {
    font-family: var(--mono);
    font-size: 12px;
    color: var(--muted);
  }
  
  .algo-description {
    font-size: 14px;
    color: var(--muted);
    line-height: 1.5;
    margin: 0;
  }
  
  .algo-meta {
    display: flex;
    flex-direction: column;
    gap: 8px;
    font-size: 12px;
  }
  
  .algo-meta-row {
    display: flex;
    gap: 8px;
  }
  
  .algo-meta-label {
    color: var(--muted);
    min-width: 100px;
  }
  
  .algo-meta-value {
    font-family: var(--mono);
  }
  
  .form-container {
    display: flex;
    flex-direction: column;
    gap: 16px;
  }
  
  .form-section {
    display: flex;
    flex-direction: column;
    gap: 12px;
  }
  
  .form-section h3 {
    font-size: 13px;
    font-weight: 600;
    color: var(--text);
    margin: 0;
  }
  
  .form-section .description {
    font-size: 12px;
    color: var(--muted);
  }
  
  .field-group {
    display: flex;
    flex-direction: column;
    gap: 6px;
  }
  
  .field-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
  }
  
  .field-label {
    font-size: 13px;
    font-weight: 500;
    color: var(--text);
  }
  
  .field-label .required {
    color: var(--err);
    margin-left: 4px;
  }
  
  .field-hint {
    font-size: 11px;
    color: var(--muted);
    font-style: italic;
  }
  
  .field-status {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    padding: 2px 8px;
    border-radius: 12px;
    font-size: 11px;
    font-weight: 500;
  }
  
  .field-status.fc-filled {
    background: #d4edda;
    color: #155724;
  }
  
  .field-status.manual {
    background: #fff3cd;
    color: #856404;
  }
  
  .field-status.consent-required {
    background: #f8d7da;
    color: #721c24;
  }
  
  .field-status.dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: currentColor;
  }
  
  .consent-toggle {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 12px;
  }
  
  .consent-toggle input[type="checkbox"] {
    width: 16px;
    height: 16px;
    accent-color: var(--accent);
  }
  
  input[type="text"],
  input[type="number"],
  input[type="email"],
  input[type="date"],
  select,
  textarea {
    width: 100%;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 6px;
    color: var(--text);
    padding: 10px 12px;
    font-family: var(--mono);
    font-size: 13px;
    transition: border-color 0.15s, box-shadow 0.15s;
  }
  
  input:focus,
  select:focus,
  textarea:focus {
    outline: none;
    border-color: var(--accent);
    box-shadow: 0 0 0 2px rgba(0, 0, 145, 0.2);
  }
  
  input:disabled,
  select:disabled,
  textarea:disabled {
    opacity: 0.5;
    cursor: not-allowed;
  }
  
  input.readonly,
  select.readonly,
  textarea.readonly {
    background: var(--panel);
    border-style: dashed;
  }
  
  select {
    cursor: pointer;
  }
  
  textarea {
    min-height: 80px;
    resize: vertical;
  }
  
  .boolean-field {
    display: flex;
    gap: 12px;
    padding: 10px 0;
  }
  
  .boolean-option {
    display: flex;
    align-items: center;
    gap: 6px;
  }
  
  .boolean-option input[type="radio"] {
    accent-color: var(--accent);
  }
  
  .array-field {
    display: flex;
    flex-direction: column;
    gap: 8px;
    padding: 10px 0;
  }
  
  .array-item {
    display: flex;
    gap: 8px;
    align-items: flex-start;
  }
  
  .array-item input,
  .array-item select {
    flex: 1;
  }
  
  .add-array-item-btn {
    background: transparent;
    color: var(--accent);
    border: 1px dashed var(--border);
    border-radius: 6px;
    padding: 8px 12px;
    font-size: 12px;
    cursor: pointer;
    align-self: flex-start;
  }
  
  .add-array-item-btn:hover {
    background: var(--bg);
  }
  
  .remove-array-item-btn {
    background: transparent;
    color: var(--err);
    border: none;
    cursor: pointer;
    padding: 4px;
    line-height: 1;
  }
  
  .remove-array-item-btn:hover {
    text-decoration: line-through;
  }
  
  .object-field {
    display: flex;
    flex-direction: column;
    gap: 12px;
    padding: 10px 0;
    border: 1px solid var(--border);
    border-radius: 6px;
    background: var(--bg);
  }
  
  .object-field .field-group {
    padding-left: 12px;
    padding-right: 12px;
    border-bottom: 1px solid var(--border);
    padding-bottom: 12px;
  }
  
  .object-field .field-group:last-child {
    border-bottom: none;
    padding-bottom: 0;
    margin-bottom: 0;
  }
  
  .actions {
    display: flex;
    justify-content: flex-end;
    gap: 12px;
    padding-top: 16px;
    border-top: 1px solid var(--border);
    margin-top: 16px;
  }
  
  .btn {
    padding: 10px 20px;
    border-radius: 6px;
    font-size: 13px;
    font-weight: 500;
    cursor: pointer;
    border: none;
    transition: background-color 0.15s, transform 0.1s;
  }
  
  .btn:active {
    transform: scale(0.98);
  }
  
  .btn-primary {
    background: var(--accent);
    color: white;
  }
  
  .btn-primary:hover {
    background: var(--accent-hover);
  }
  
  .btn-secondary {
    background: var(--bg);
    color: var(--text);
    border: 1px solid var(--border);
  }
  
  .btn-secondary:hover {
    background: var(--panel);
  }
  
  .btn-danger {
    background: #dc3545;
    color: white;
  }
  
  .btn-danger:hover {
    background: #c82333;
  }
  
  .results {
    display: none;
    flex-direction: column;
    gap: 16px;
  }
  
  .results h3 {
    font-size: 14px;
    font-weight: 600;
    margin: 0;
  }
  
  .results pre {
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 16px;
    font-family: var(--mono);
    font-size: 12px;
    overflow-x: auto;
    white-space: pre-wrap;
    word-wrap: break-word;
  }
  
  .result-status {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 6px 12px;
    border-radius: 6px;
    font-size: 13px;
    font-weight: 500;
  }
  
  .result-status.ok {
    background: #d4edda;
    color: #155724;
  }
  
  .result-status.err {
    background: #f8d7da;
    color: #721c24;
  }
  
  .error-message {
    background: #f8d7da;
    border: 1px solid #f5c6cb;
    border-radius: 6px;
    padding: 12px;
    color: #721c24;
    font-size: 13px;
    display: none;
  }
  
  .error-message.active {
    display: block;
  }
</style>
</head>
<body>

<header>
  <div>
    <h1 id="algo-title">Algorithme</h1>
    <p class="subtitle">Exécution avec vos données</p>
  </div>
  <a href="/user/algorithms" class="back-link">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <path d="M19 12H5M12 19l-7-7 7-7"/>
    </svg>
    Retour
  </a>
</header>

<main>
  <!-- Left sidebar: Algorithm info -->
  <section class="panel">
    <h2>Informations</h2>
    <div class="algo-info" id="algo-info">
      <div>Chargement...</div>
    </div>
  </section>

  <!-- Right content: Execution form -->
  <section class="panel">
    <h2>Entrées</h2>
    <div id="error-message" class="error-message"></div>
    <form id="execute-form" class="form-container">
      <div id="form-fields">Chargement du formulaire...</div>
      <div class="actions">
        <button type="button" class="btn btn-secondary" id="cancel-btn">Annuler</button>
        <button type="submit" class="btn btn-primary" id="execute-btn">
          <span id="execute-btn-text">Exécuter</span>
        </button>
      </div>
    </form>
    
    <div id="results" class="results">
      <h3>Résultat</h3>
      <div id="result-status" class="result-status"></div>
      <pre id="result-output"></pre>
    </div>
  </section>
</main>

<script>
const $ = (id) => document.getElementById(id);

// API helper
async function apiGet(endpoint) {
  const res = await fetch(endpoint, { credentials: 'include' });
  if (!res.ok) {
    if (res.status === 401) {
      window.location.href = '/user/login';
      return null;
    }
    throw new Error(`API error: ${res.status}`);
  }
  return res.json();
}

async function apiPost(endpoint, body) {
  const res = await fetch(endpoint, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(body),
    credentials: 'include'
  });
  if (!res.ok) {
    const error = await res.json();
    throw new Error(error.detail || `API error: ${res.status}`);
  }
  return res.json();
}

// Form field types
const FIELD_TYPES = {
  string: 'text',
  number: 'number',
  integer: 'number',
  boolean: 'boolean',
  array: 'array',
  object: 'object'
};

// Current manifest ID (from URL)
const manifestId = window.location.pathname.split('/').pop();

// Form data state
let formData = {};
let fieldMetadata = [];

// Load algorithm info and form
async function loadAlgorithmInfo() {
  try {
    const data = await apiGet(`/user/catalog/${encodeURIComponent(manifestId)}`);
    const manifest = data.manifest;
    fieldMetadata = data.field_metadata || [];
    
    // Update header
    $('algo-title').textContent = manifest['dct:title'] || manifest.id;
    
    // Build algo info
    const info = $('algo-info');
    info.innerHTML = `
      <div class="algo-id">${manifest.id}</div>
      <p class="algo-description">${manifest.description || 'Aucune description'}</p>
      <div class="algo-meta">
        <div class="algo-meta-row">
          <span class="algo-meta-label">Organisation:</span>
          <span class="algo-meta-value">${manifest.org || '—'}</span>
        </div>
        <div class="algo-meta-row">
          <span class="algo-meta-label">Version:</span>
          <span class="algo-meta-value">${manifest.version || '—'}</span>
        </div>
        <div class="algo-meta-row">
          <span class="algo-meta-label">Language:</span>
          <span class="algo-meta-value">${manifest.runtime?.language || '—'}</span>
        </div>
      </div>
    `;
    
    // Build form
    buildForm();
    
  } catch (e) {
    $('algo-info').innerHTML = `<p>Erreur: ${e.message}</p>`;
    $('form-fields').innerHTML = `<p>Impossible de charger l'algorithme.</p>`;
  }
}

// Build form from metadata
function buildForm() {
  const container = $('form-fields');
  container.innerHTML = '';
  
  // Group fields by top-level path
  const groups = {};
  for (const field of fieldMetadata) {
    const topLevel = field.path.split('.')[0];
    if (!groups[topLevel]) {
      groups[topLevel] = [];
    }
    groups[topLevel].push(field);
  }
  
  // Create a form section for each group
  for (const [groupName, fields] of Object.entries(groups)) {
    const section = document.createElement('div');
    section.className = 'form-section';
    
    const header = document.createElement('h3');
    header.textContent = groupName.replace(/_/g, ' ');
    section.appendChild(header);
    
    // Add fields to section
    for (const field of fields) {
      const fieldGroup = createFieldGroup(field);
      section.appendChild(fieldGroup);
    }
    
    container.appendChild(section);
  }
  
  // If no groups, show message
  if (Object.keys(groups).length === 0) {
    container.innerHTML = '<p>Aucun champ à compléter. L\'algorithme utilise uniquement des données France Connect.</p>';
  }
}

// Create a form field group
function createFieldGroup(field) {
  const group = document.createElement('div');
  group.className = 'field-group';
  group.dataset.path = field.path;
  
  // Header with label and status
  const header = document.createElement('div');
  header.className = 'field-header';
  
  const label = document.createElement('label');
  label.className = 'field-label';
  label.textContent = field.label || field.path;
  if (field.required) {
    const required = document.createElement('span');
    required.className = 'required';
    required.textContent = '*';
    label.appendChild(required);
  }
  
  // Status badge
  const status = document.createElement('span');
  if (field.has_fc_value) {
    status.className = 'field-status fc-filled';
    status.innerHTML = '<span class="field-status dot"></span>FC';
  } else if (!field.consented && field.required) {
    status.className = 'field-status consent-required';
    status.innerHTML = '<span class="field-status dot"></span>Consentement requis';
  } else {
    status.className = 'field-status manual';
    status.innerHTML = '<span class="field-status dot"></span>À compléter';
  }
  
  header.appendChild(label);
  header.appendChild(status);
  group.appendChild(header);
  
  // Field input based on type
  const input = createFieldInput(field);
  group.appendChild(input);
  
  // Hint
  if (field.schema.description) {
    const hint = document.createElement('span');
    hint.className = 'field-hint';
    hint.textContent = field.schema.description;
    group.appendChild(hint);
  }
  
  return group;
}

// Create field input based on type
function createFieldInput(field) {
  const schema = field.schema;
  const type = schema.type || 'string';
  const path = field.path;
  
  // Determine if field is an array
  if (type === 'array') {
    return createArrayField(field);
  }
  
  // Determine if field is an object
  if (type === 'object') {
    return createObjectField(field);
  }
  
  // For boolean, create radio buttons
  if (type === 'boolean') {
    return createBooleanField(field);
  }
  
  // For enum, create select
  if (schema.enum) {
    return createSelectField(field);
  }
  
  // For simple types, create input
  const input = document.createElement('input');
  input.type = FIELD_TYPES[type] || 'text';
  input.id = `field-${path.replace(/\./g, '-')}`;
  input.name = path;
  input.dataset.path = path;
  
  // Set initial value
  if (field.value !== null && field.value !== undefined) {
    input.value = field.value;
    input.classList.add('readonly');
    input.readOnly = true;
    // Store in formData
    setNestedValue(formData, path, field.value);
  } else if (schema.default !== undefined) {
    input.value = schema.default;
    setNestedValue(formData, path, schema.default);
  }
  
  // Add placeholder
  if (schema.description) {
    input.placeholder = schema.description.substring(0, 50);
  } else if (schema.title) {
    input.placeholder = schema.title;
  }
  
  // Add pattern for strings
  if (type === 'string' && schema.pattern) {
    input.pattern = schema.pattern;
  }
  
  // Add required attribute
  if (field.required) {
    input.required = true;
  }
  
  // Handle change
  input.addEventListener('change', (e) => {
    setNestedValue(formData, path, e.target.value);
  });
  
  input.addEventListener('input', (e) => {
    setNestedValue(formData, path, e.target.value);
  });
  
  return input;
}

// Create boolean field (radio buttons)
function createBooleanField(field) {
  const container = document.createElement('div');
  container.className = 'boolean-field';
  container.dataset.path = field.path;
  
  const path = field.path;
  const value = field.value !== null && field.value !== undefined ? field.value : field.schema.default;
  
  // Store initial value
  setNestedValue(formData, path, value);
  
  const options = [
    { label: 'Oui', value: true },
    { label: 'Non', value: false }
  ];
  
  for (const opt of options) {
    const option = document.createElement('label');
    option.className = 'boolean-option';
    
    const input = document.createElement('input');
    input.type = 'radio';
    input.name = `bool-${path.replace(/\./g, '-')}`;
    input.value = opt.value;
    input.checked = opt.value === value;
    input.dataset.path = path;
    
    input.addEventListener('change', (e) => {
      setNestedValue(formData, path, e.target.value === 'true');
    });
    
    option.appendChild(input);
    option.appendChild(document.createTextNode(opt.label));
    container.appendChild(option);
  }
  
  return container;
}

// Create select field for enum
function createSelectField(field) {
  const select = document.createElement('select');
  select.id = `field-${field.path.replace(/\./g, '-')}`;
  select.name = field.path;
  select.dataset.path = field.path;
  
  const path = field.path;
  const schema = field.schema;
  const value = field.value !== null && field.value !== undefined ? field.value : schema.default;
  
  // Add placeholder option
  const placeholder = document.createElement('option');
  placeholder.value = '';
  placeholder.textContent = '-- Sélectionnez --';
  placeholder.disabled = field.required;
  placeholder.selected = !value;
  select.appendChild(placeholder);
  
  // Add options from enum
  for (const enumValue of schema.enum) {
    const option = document.createElement('option');
    option.value = enumValue;
    option.textContent = typeof enumValue === 'string' ? enumValue : JSON.stringify(enumValue);
    if (enumValue === value) {
      option.selected = true;
      setNestedValue(formData, path, value);
    }
    select.appendChild(option);
  }
  
  select.addEventListener('change', (e) => {
    setNestedValue(formData, path, e.target.value);
  });
  
  if (field.required) {
    select.required = true;
  }
  
  return select;
}

// Create array field
function createArrayField(field) {
  const container = document.createElement('div');
  container.className = 'array-field';
  container.dataset.path = field.path;
  
  const path = field.path;
  const itemsSchema = field.schema.items || {};
  
  // Initial items
  const initialValue = field.value || field.schema.default || [];
  if (!Array.isArray(initialValue)) {
    initialValue = [];
  }
  
  // Store in formData
  setNestedValue(formData, path, initialValue);
  
  // Create items
  const itemsContainer = document.createElement('div');
  itemsContainer.className = 'array-items';
  
  for (let i = 0; i < initialValue.length; i++) {
    const item = createArrayItem(path, i, initialValue[i], itemsSchema);
    itemsContainer.appendChild(item);
  }
  
  container.appendChild(itemsContainer);
  
  // Add button
  const addBtn = document.createElement('button');
  addBtn.type = 'button';
  addBtn.className = 'add-array-item-btn';
  addBtn.textContent = '+ Ajouter un élément';
  addBtn.addEventListener('click', () => {
    const index = itemsContainer.children.length;
    const item = createArrayItem(path, index, getDefaultValue(itemsSchema), itemsSchema);
    itemsContainer.appendChild(item);
    // Update formData
    const current = getNestedValue(formData, path) || [];
    current.push(getDefaultValue(itemsSchema));
    setNestedValue(formData, path, current);
  });
  
  container.appendChild(addBtn);
  
  return container;
}

// Create array item
function createArrayItem(arrayPath, index, value, itemsSchema) {
  const container = document.createElement('div');
  container.className = 'array-item';
  container.dataset.index = index;
  
  // Create input based on item type
  const itemType = itemsSchema.type || 'string';
  const input = document.createElement('input');
  input.type = FIELD_TYPES[itemType] || 'text';
  input.dataset.arrayPath = arrayPath;
  input.dataset.index = index;
  
  // Set value
  if (value !== null && value !== undefined) {
    input.value = value;
  }
  
  input.addEventListener('change', (e) => {
    const arr = getNestedValue(formData, arrayPath) || [];
    arr[index] = e.target.value;
    setNestedValue(formData, arrayPath, arr);
  });
  
  // Remove button
  const removeBtn = document.createElement('button');
  removeBtn.type = 'button';
  removeBtn.className = 'remove-array-item-btn';
  removeBtn.textContent = '×';
  removeBtn.addEventListener('click', () => {
    container.remove();
    // Update formData
    const arr = getNestedValue(formData, arrayPath) || [];
    arr.splice(index, 1);
    setNestedValue(formData, arrayPath, arr);
    // Renumber remaining items
    updateArrayItemIndices(arrayPath, itemsContainer);
  });
  
  container.appendChild(input);
  container.appendChild(removeBtn);
  
  return container;
}

// Update indices after removal
function updateArrayItemIndices(arrayPath, container) {
  const items = container.children;
  for (let i = 0; i < items.length; i++) {
    items[i].dataset.index = i;
    const input = items[i].querySelector('input');
    if (input) {
      input.dataset.index = i;
    }
  }
}

// Create object field
function createObjectField(field) {
  const container = document.createElement('div');
  container.className = 'object-field';
  container.dataset.path = field.path;
  
  const path = field.path;
  const properties = field.schema.properties || {};
  const initialValue = field.value || field.schema.default || {};
  
  // Store in formData
  setNestedValue(formData, path, initialValue);
  
  // Create fields for each property
  for (const [propName, propSchema] of Object.entries(properties)) {
    const propPath = `${path}.${propName}`;
    const propField = {
      path: propPath,
      label: propSchema.title || propName,
      schema: propSchema,
      required: (field.schema.required || []).includes(propName),
      value: initialValue[propName],
      has_fc_value: false,
      consented: true
    };
    
    const fieldGroup = createFieldGroup(propField);
    container.appendChild(fieldGroup);
  }
  
  return container;
}

// Helper: Set nested value in object
function setNestedValue(obj, path, value) {
  const parts = path.split('.');
  let current = obj;
  
  for (let i = 0; i < parts.length - 1; i++) {
    const part = parts[i];
    if (!current[part]) {
      current[part] = {};
    }
    if (typeof current[part] !== 'object') {
      current[part] = {};
    }
    current = current[part];
  }
  
  current[parts[parts.length - 1]] = value;
}

// Helper: Get nested value from object
function getNestedValue(obj, path) {
  const parts = path.split('.');
  let current = obj;
  
  for (const part of parts) {
    if (current === null || current === undefined) {
      return undefined;
    }
    current = current[part];
  }
  
  return current;
}

// Helper: Get default value for schema
function getDefaultValue(schema) {
  if (schema.default !== undefined) {
    return schema.default;
  }
  if (schema.type === 'array') {
    return [];
  }
  if (schema.type === 'object') {
    return {};
  }
  if (schema.type === 'boolean') {
    return false;
  }
  if (schema.type === 'number' || schema.type === 'integer') {
    return 0;
  }
  return '';
}

// Form submission
async function handleSubmit(e) {
  e.preventDefault();
  
  const btn = $('execute-btn');
  const btnText = $('execute-btn-text');
  const error = $('error-message');
  const results = $('results');
  
  // Disable button during execution
  btn.disabled = true;
  btnText.textContent = 'Exécution...';
  error.classList.remove('active');
  results.style.display = 'none';
  
  try {
    // Prepare request body
    const body = {
      input: formData
    };
    
    // Execute algorithm
    const result = await apiPost(`/user/execute/${encodeURIComponent(manifestId)}`, body);
    
    // Show results
    results.style.display = 'flex';
    const status = $('result-status');
    status.className = 'result-status ok';
    status.textContent = '✓ Exécution réussie';
    
    const output = $('result-output');
    output.textContent = JSON.stringify(result, null, 2);
    
    // Scroll to results
    results.scrollIntoView({ behavior: 'smooth' });
    
  } catch (e) {
    error.textContent = `Erreur: ${e.message}`;
    error.classList.add('active');
    error.scrollIntoView({ behavior: 'smooth' });
  } finally {
    btn.disabled = false;
    btnText.textContent = 'Exécuter';
  }
}

// Cancel button
function handleCancel() {
  if (confirm('Voulez-vous annuler et revenir à la liste des algorithmes ?')) {
    window.location.href = '/user/algorithms';
  }
}

// Initialize
async function init() {
  await loadAlgorithmInfo();
  
  // Set up form
  const form = $('execute-form');
  form.addEventListener('submit', handleSubmit);
  
  $('cancel-btn').addEventListener('click', handleCancel);
}

// Start
init();
</script>
