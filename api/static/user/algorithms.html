<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Datapi - Mes algorithmes publics</title>
<link rel="stylesheet" href="/static/styles/communs.css">
</head>
<body>
<header>
  <div>
    <h1>Mes algorithmes publics</h1>
    <p class="subtitle">Datapi - Exécutez des algorithmes avec vos données</p>
  </div>
  <div class="user-info">
    <div class="user-avatar">QU</div>
    <div class="user-details">
      <span class="user-name" id="user-name">Utilisateur</span>
      <span class="user-email" id="user-email">Chargement...</span>
    </div>
    <a href="/user/logout" class="logout-btn">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
        <polyline points="16 17 21 12 16 7"/>
        <line x1="21" y1="12" x2="9" y2="12"/>
      </svg>
      Déconnexion
    </a>
  </div>
</header>

<main>
  <!-- Left sidebar: Pivot data -->
  <section class="panel">
    <div class="algorithms-header">
      <h2>Mes données pivots</h2>
      <button class="refresh-btn" id="refresh-pivot">↻ Rafraîchir</button>
    </div>
    <div id="pivot-data">Chargement des données...</div>
  </section>

  <!-- Right content: Algorithms -->
  <section class="panel">
    <div class="algorithms-header">
      <h2>Algorithmes disponibles</h2>
      <span class="algorithms-count" id="algorithms-count">0 algorithme(s)</span>
    </div>
    <div id="algorithm-list">Chargement des algorithmes...</div>
  </section>
</main>

<script>
const $ = (id) => document.getElementById(id);

// API helper
async function apiGet(endpoint, options = {}) {
  const res = await fetch(endpoint, {
    credentials: 'include',
    ...options
  });
  if (!res.ok) {
    if (res.status === 401) {
      window.location.href = '/user/login';
      return null;
    }
    throw new Error(`API error: ${res.status}`);
  }
  return res.json();
}

// Load pivot data
async function loadPivotData() {
  const container = $('pivot-data');
  try {
    const data = await apiGet('/user/pivot');
    const pivot = data.pivot_data;
    
    if (!pivot || Object.keys(pivot).length === 0) {
      container.innerHTML = '<p class="empty-state">Aucune donnée pivot disponible</p>';
      return;
    }
    
    // Build pivot grid
    const grid = document.createElement('div');
    grid.className = 'pivot-grid';
    
    for (const [key, value] of Object.entries(pivot)) {
      const item = document.createElement('div');
      item.className = 'pivot-item';
      
      const label = document.createElement('span');
      label.className = 'pivot-label';
      label.textContent = key.replace(/_/g, ' ');
      
      const val = document.createElement('span');
      val.className = 'pivot-value' + (value === null || value === undefined ? ' empty' : '');
      val.textContent = value !== null && value !== undefined ? String(value) : '—';
      
      item.appendChild(label);
      item.appendChild(val);
      grid.appendChild(item);
    }
    
    container.innerHTML = '';
    container.appendChild(grid);
    
    // Update user info in header
    const fullName = pivot.full_name || pivot.given_name + ' ' + pivot.family_name || 'Utilisateur';
    const email = pivot.email || '';
    $('user-name').textContent = fullName;
    $('user-email').textContent = email || 'Aucun email';
    
  } catch (e) {
    container.innerHTML = `<p class="empty-state">Erreur: ${e.message}</p>`;
  }
}

// Load algorithms
async function loadAlgorithms() {
  const container = $('algorithm-list');
  const countEl = $('algorithms-count');
  
  try {
    const data = await apiGet('/user/catalog');
    const algorithms = data.algorithms || [];
    
    countEl.textContent = `${algorithms.length} algorithme(s)`;
    
    if (algorithms.length === 0) {
      container.innerHTML = `
        <div class="empty-state">
          <h3>Aucun algorithme disponible</h3>
          <p>Les algorithmes publiés apparaitront ici.</p>
        </div>
      `;
      return;
    }
    
    const list = document.createElement('div');
    list.className = 'algorithm-list';
    
    for (const algo of algorithms) {
      const card = document.createElement('div');
      card.className = 'algorithm-card';
      card.onclick = () => window.location.href = `/user/execute/${encodeURIComponent(algo.id)}`;
      
      const header = document.createElement('div');
      header.className = 'algorithm-header';
      
      const titleDiv = document.createElement('div');
      const title = document.createElement('h3');
      title.className = 'algorithm-title';
      title.textContent = algo.title || algo.id;
      
      const algoId = document.createElement('span');
      algoId.className = 'algorithm-id';
      algoId.textContent = algo.id;
      
      titleDiv.appendChild(title);
      titleDiv.appendChild(algoId);
      
      const meta = document.createElement('div');
      meta.className = 'algorithm-meta';
      
      // FC mapping status
      const fcStatus = document.createElement('span');
      fcStatus.className = 'algorithm-status ' + (algo.has_fc_mapping ? 'fc-mapped' : 'no-fc');
      fcStatus.innerHTML = (algo.has_fc_mapping ? 'FC Mapping' : 'Pas de mapping FC');
      
      // Tags
      if (algo.tags && algo.tags.length > 0) {
        const tags = document.createElement('div');
        tags.className = 'algorithm-tags';
        for (const tag of algo.tags) {
          const tagEl = document.createElement('span');
          tagEl.className = 'tag';
          tagEl.textContent = tag;
          tags.appendChild(tagEl);
        }
        meta.appendChild(tags);
      }
      
      meta.appendChild(fcStatus);
      
      header.appendChild(titleDiv);
      header.appendChild(meta);
      
      const desc = document.createElement('p');
      desc.className = 'algorithm-description';
      desc.textContent = algo.description || 'Aucune description';
      
      const executeBtn = document.createElement('button');
      executeBtn.className = 'execute-btn';
      executeBtn.textContent = 'Exécuter';
      executeBtn.onclick = (e) => {
        e.stopPropagation();
        window.location.href = `/user/execute/${encodeURIComponent(algo.id)}`;
      };
      
      card.appendChild(header);
      card.appendChild(desc);
      card.appendChild(executeBtn);
      list.appendChild(card);
    }
    
    container.innerHTML = '';
    container.appendChild(list);
    
  } catch (e) {
    container.innerHTML = `<div class="empty-state"><h3>Erreur</h3><p>${e.message}</p></div>`;
  }
}

// Refresh handlers
$('refresh-pivot').onclick = () => {
  loadPivotData();
};

// Initial load
loadPivotData();
loadAlgorithms();

// Refresh every 5 minutes
setInterval(() => {
  loadPivotData();
  loadAlgorithms();
}, 5 * 60 * 1000);
</script>

</body>
</html>
