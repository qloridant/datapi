[project]
name = "datapi"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Quentin Loridant", email = "quentin.loridant.ext@numerique.gouv.fr" }
]
requires-python = ">=3.13"
dependencies = [
    "authlib==1.2.0",
    "fastapi[all]==0.141.1",
    "jsonschema==4.26.0",
    "psycopg2-binary==2.9.12",
    "pydantic==2.9.0",
    "pass-culture-rules",
    "python-dotenv==1.0.0",
    "regalgo==0.0.3",
    "requests==2.32.0",
    "sqlalchemy==2.0.52",
    "uvicorn[standard]==0.22.0",
]

[project.scripts]
datapi = "datapi:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[[tool.uv.index]]
name = "testpypi"
url = "https://test.pypi.org/simple/"
explicit = true

[tool.uv.sources]
regalgo = { index = "testpypi" }
pass-culture-rules = { path = "examples/pass-culture-package", editable = true }

[regalgo]

[dependency-groups]
dev = [
    "pytest",
]

[tool.pytest.ini_options]
# scoped to this project's own suite -- examples/pass-culture-package/tests
# and external_repositories/ carry their own, separate test suites.
testpaths = ["tests"]

