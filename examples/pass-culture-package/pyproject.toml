[project]
name = "pass-culture-rules"
version = "2.0.0"
description = "Algorithmes réglementaires pass Culture, conformes à regalgo"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
keywords = ["pass-culture", "regalgo", "eligibilite", "reglementation"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries",
]
dependencies = [
    "regalgo",
]

[dependency-groups]
dev = ["pytest>=8", "pytest-cov"]

[project.urls]
"Legal reference (2021-628)" = "https://www.legifrance.gouv.fr/jorf/id/JORFTEXT000043518870"
"Legal reference (2025-195)" = "https://www.legifrance.gouv.fr/jorf/id/JORFTEXT000051261329"
"Source" = "https://github.com/pass-culture/pass-culture-main"
"regalgo" = "https://github.com/datagouv/regalgo"

[tool.hatch.build.targets.wheel]
packages = ["src/pass_culture_rules"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[[tool.uv.index]]
name = "testpypi"
url = "https://test.pypi.org/simple/"
explicit = true

[tool.pytest.ini_options]
testpaths = ["tests"]
