version: '3.8'
services:
  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    environment:
      - DATABASE_URL=postgresql://datapi:datapi@postgres:5432/datapi
      - AUTH_TOKEN=test-token
    ports:
      - "8000:8000"

  auth:
    build:
      context: .
      dockerfile: api/Dockerfile
    command: ["uv", "run", "--no-sync", "uvicorn", "auth.server:app", "--host", "0.0.0.0", "--port", "9000"]
    environment:
      - AUTH_TOKEN=test-token
    ports:
      - "9000:9000"
